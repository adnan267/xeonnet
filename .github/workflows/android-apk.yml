# Builds an installable Android APK of the Xeon Net app (mobile/) whenever the app changes.
# Download it from GitHub → Actions → "Android APK" → the latest run → Artifacts.
# (For Google Play and iPhone use EAS: see mobile/README.md.)
name: Android APK

on:
  push:
    branches: [v2]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://xeonnet.site
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: xeon-net-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
